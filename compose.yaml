# Runs the compiled app in a container with docker compose up --build
# (docs/plataforma/infraestrutura.md); day-to-day development uses npm run dev.
name: glow

services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Read at run time only; the image never contains .env files.
    env_file: .env.local
