openapi: 3.1.0
info:
  title: Glow – Estética Automotiva API
  version: 0.1.0
  description: >-
    API interna do Glow, servida pelas rotas do Next.js sob /api, no mesmo
    domínio das páginas (docs/padroes/api.md). Não tem versão no caminho
    (decisão 0026); o campo version acompanha o package.json só porque é
    obrigatório. Toda resposta de erro é Problem Details (RFC 9457, decisão
    0025), e nenhuma resposta vai para cache (Cache-Control: no-store). Toda
    gravação (POST, PUT, PATCH e DELETE) exige o cabeçalho Origin com o host
    da própria requisição; com corpo, só application/json, até 100 KB.
    Rotas e regras de cada assunto: docs/<assunto>/rotas.md.
servers:
  - url: /
tags:
  - name: auth
    description: >-
      Cadastro de cliente, login único de clientes e funcionários, sessão,
      logout e troca de senha (docs/acesso/rotas.md,
      docs/acesso/autenticacao.md).
  - name: public
    description: >-
      Dados da empresa e catálogo, sem autenticação
      (docs/configuracoes/rotas.md, docs/catalogo/rotas.md).
  - name: settings
    description: >-
      Configurações do painel: dados da empresa, disponibilidade e formas de
      pagamento, com a permissão settings (docs/configuracoes/rotas.md).
paths:
  /api/auth/register:
    post:
      tags:
        - auth
      operationId: register
      summary: Cria a conta de cliente
      description: >-
        Cadastro pelo portal (UC02). Cria a conta no Supabase Auth, com o
        e-mail já confirmado, e o cliente em clients; se a gravação do cliente
        falhar, a conta recém-criada é removida. Não inicia sessão nem altera
        a que existir: a interface leva ao login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Conta criada, com os dados gravados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredClient"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "409":
          description: >-
            EMAIL_IN_USE: o e-mail já tem conta, de cliente ou de funcionário
            (RN022).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Inicia a sessão de cliente ou de funcionário
      description: >-
        Login único (UC03, UC08, RN029). Valida o e-mail e a senha no
        Supabase Auth e grava a sessão em cookies. Cinco falhas seguidas para
        o mesmo e-mail bloqueiam o login por 15 minutos (RS006). Com a senha
        certa, a conta desativada recebe 403, e a conta excluída ou sem perfil
        recebe o mesmo 401 do e-mail inexistente (RS005).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessão iniciada.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: >-
            INVALID_CREDENTIALS: e-mail inexistente, senha errada ou conta sem
            perfil, sempre com a mesma mensagem (RS005).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            ACCOUNT_INACTIVE: funcionário desativado, com a senha certa
            (RN026); nenhum cookie de sessão é gravado. FORBIDDEN: origem
            recusada (RS014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: >-
            ACCOUNT_LOCKED: e-mail bloqueado por excesso de tentativas, mesmo
            com a senha certa (RS006).
          headers:
            Retry-After:
              description: Segundos até o fim do bloqueio.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Encerra a sessão deste navegador
      description: >-
        Encerra no Supabase Auth a sessão deste navegador, sem afetar as de
        outros aparelhos, e apaga os cookies (RS007). Não exige sessão: sem
        ela, com a conta desativada ou com a senha inicial pendente, responde
        204 do mesmo jeito. Sem corpo.
      security: []
      responses:
        "204":
          description: Sessão encerrada, ou nenhuma sessão a encerrar.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/ForbiddenOrigin"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/me:
    get:
      tags:
        - auth
      operationId: getSessionUser
      summary: Devolve o usuário da sessão e suas permissões
      description: >-
        Perfil, situação e permissões lidos do banco nesta requisição (RS011).
        Aceita a senha inicial pendente, informada em mustChangePassword
        (RS004).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Usuário da sessão.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: >-
            UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
            excluída ou sem perfil.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "ACCOUNT_INACTIVE: funcionário desativado (RN026)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/auth/change-password:
    post:
      tags:
        - auth
      operationId: changePassword
      summary: Troca a senha, inclusive a inicial no primeiro acesso
      description: >-
        Confere a senha atual, que no primeiro acesso é a inicial, por uma
        nova entrada no Supabase Auth e grava a nova senha (UC03, UC04, UC08,
        RN023, RS004, decisão 0048). Aceita a senha inicial pendente e remove
        a marca de troca. A sessão deste navegador continua, renovada nos
        cookies, e as de outros aparelhos são encerradas. As senhas atuais
        erradas contam no mesmo bloqueio do login (RS006).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Senha alterada e marca de troca pendente removida.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "400":
          description: >-
            VALIDATION_ERROR: nova senha igual à atual ou fora do formato de
            RS003, com a mensagem em fields; ou corpo que não é JSON válido,
            sem fields.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: >-
            INVALID_CURRENT_PASSWORD: senha atual incorreta; a sessão continua.
            UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
            excluída ou sem perfil.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: >-
            ACCOUNT_INACTIVE: funcionário desativado (RN026). FORBIDDEN: origem
            recusada (RS014).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: >-
            ACCOUNT_LOCKED: e-mail da conta bloqueado por excesso de senhas
            erradas, no login ou na troca de senha (RS006).
          headers:
            Retry-After:
              description: Segundos até o fim do bloqueio.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/public/company:
    get:
      tags:
        - public
      operationId: getPublicCompany
      summary: Devolve os dados institucionais e a disponibilidade
      description: >-
        Dados exibidos no rodapé e na página inicial do portal (RN028, RF004)
        e a disponibilidade dos sete dias da semana. O CNPJ não é público. O
        dado opcional vazio vem como null.
      security: []
      responses:
        "200":
          description: Dados da empresa e disponibilidade.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCompany"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/settings/company:
    get:
      tags:
        - settings
      operationId: getCompanySettings
      summary: Devolve os dados da empresa para edição
      description: >-
        Dados da empresa (UC22), com o updatedAt que o PUT devolve (RNF011).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dados da empresa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - settings
      operationId: updateCompanySettings
      summary: Grava os dados da empresa
      description: >-
        Substitui os dados da empresa (UC22), com os formatos de RN035. O dado
        opcional ausente, null ou vazio apaga o valor gravado. A gravação só
        acontece se o registro ainda tiver o updatedAt enviado, conferido na
        própria instrução (RNF011, decisão 0009).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsInput"
      responses:
        "200":
          description: Dados gravados, já normalizados, com o novo updatedAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PanelForbidden"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-<referência-do-projeto>-auth-token
      description: >-
        Sessão do Supabase Auth, gravada pelo servidor com @supabase/ssr. O
        valor pode vir dividido em pedaços (.0, .1). HttpOnly, Secure,
        SameSite=Lax e Path=/.
  headers:
    SessionCookies:
      description: >-
        Cookies da sessão, com HttpOnly, Secure, SameSite=Lax e Path=/; no
        encerramento, com Max-Age=0.
      schema:
        type: string
  schemas:
    Profile:
      type: string
      enum:
        - client
        - staff
        - admin
      description: Perfil da conta (guia/mapa.md); admin é o staff com is_admin.
    Permission:
      type: string
      enum:
        - dashboard
        - appointments
        - services
        - clients
        - staff
        - settings
      description: Uma permissão por página do painel, na ordem de RN025.
    RegisterInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
        - password
      properties:
        firstName:
          type: string
          description: >-
            Nome no formato de RN035: de 2 a 60 letras, com espaço, hífen e
            apóstrofo; gravado com as iniciais maiúsculas e as partículas em
            minúsculas.
          examples:
            - maria
        lastName:
          type: string
          description: Sobrenome, no mesmo formato do nome.
          examples:
            - DA SILVA
        email:
          type: string
          format: email
          maxLength: 254
          description: Formato de RN035; gravado em minúsculas e sem espaços.
          examples:
            - maria@email.com
        phone:
          type: string
          description: >-
            Celular com DDD válido e nove dígitos, iniciado por 9 (RN035); a
            máscara é aceita e removida.
          examples:
            - (82) 99999-8888
        password:
          type: string
          minLength: 8
          description: >-
            RS003: de 8 a 72 caracteres, com o máximo contado em bytes UTF-8,
            ao menos uma letra maiúscula, um número e um caractere especial;
            gravada como digitada.
      description: >-
        Campos não previstos são descartados (RS013), inclusive a marca de
        troca de senha.
    RegisteredClient:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phone
      properties:
        firstName:
          type: string
          examples:
            - Maria
        lastName:
          type: string
          examples:
            - da Silva
        email:
          type: string
          examples:
            - maria@email.com
        phone:
          type: string
          pattern: "^[0-9]{11}$"
          examples:
            - "82999998888"
      description: >-
        Dados gravados, já normalizados (RN035): os mesmos campos de GET
        /api/me/profile, sem o id, que vem sempre da sessão (RS009).
    ChangePasswordInput:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          description: >-
            Senha atual, que no primeiro acesso é a inicial; como digitada,
            até 72 bytes em UTF-8, sem as regras de composição do RS003.
        newPassword:
          type: string
          minLength: 8
          description: >-
            Formato de RS003, como digitada, e diferente da atual (RN023,
            RS004).
      description: Campos não previstos são descartados (RS013).
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Formato de RN035; gravado em minúsculas e sem espaços.
          examples:
            - maria@email.com
        password:
          type: string
          minLength: 1
          description: >-
            Como digitada, até 72 bytes em UTF-8, sem as regras de composição
            do RS003.
      description: Campos não previstos são descartados (RS013).
    SessionUser:
      type: object
      required:
        - profile
        - firstName
        - lastName
        - mustChangePassword
        - permissions
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        firstName:
          type: string
          examples:
            - Ana
        lastName:
          type: string
          examples:
            - Souza
        mustChangePassword:
          type: boolean
          description: Senha inicial pendente de troca (RN023, RS004).
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          description: >-
            Na ordem de RN025; todas para o admin (RN027) e nenhuma para o
            cliente ou para o funcionário de cargo inativo.
          examples:
            - - dashboard
              - appointments
    BusinessDay:
      type: object
      required:
        - weekday
        - isOpen
        - opensAt
        - closesAt
        - breakStartsAt
        - breakEndsAt
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Dia da semana, de domingo (0) a sábado (6).
        isOpen:
          type: boolean
          description: Indica se a empresa funciona no dia.
        opensAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: >-
            Abertura em HH:MM, no fuso da empresa, sem data nem deslocamento;
            null no dia fechado.
          examples:
            - "08:00"
        closesAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Encerramento em HH:MM; null no dia fechado.
          examples:
            - "18:00"
        breakStartsAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Início da pausa em HH:MM (RN013); null sem pausa.
          examples:
            - "12:00"
        breakEndsAt:
          type:
            - string
            - "null"
          pattern: "^([01][0-9]|2[0-3]):(00|30)$"
          description: Fim da pausa em HH:MM; null sem pausa.
          examples:
            - "13:00"
    PublicCompany:
      type: object
      required:
        - companyName
        - email
        - phone
        - whatsapp
        - address
        - instagramUrl
        - facebookUrl
        - businessHours
      properties:
        companyName:
          type: string
          maxLength: 100
          examples:
            - Glow – Estética Automotiva
        email:
          type:
            - string
            - "null"
          examples:
            - contato@glow.com
        phone:
          type:
            - string
            - "null"
          pattern: "^[0-9]{10,11}$"
          description: Fixo ou celular, só os algarismos.
          examples:
            - "8233334444"
        whatsapp:
          type:
            - string
            - "null"
          pattern: "^[0-9]{11}$"
          description: Celular, só os algarismos.
          examples:
            - "82999998888"
        address:
          type:
            - string
            - "null"
          maxLength: 200
          examples:
            - Rua Exemplo, 100 – Ponta Verde, Maceió – AL
        instagramUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 200
          examples:
            - https://instagram.com/glow
        facebookUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 200
          examples:
            - https://facebook.com/glow
        businessHours:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/BusinessDay"
          description: Os sete dias, de domingo a sábado.
      description: >-
        Dados como gravados, já normalizados (RN035); o opcional vazio é null.
    CompanySettings:
      type: object
      required:
        - companyName
        - cnpj
        - email
        - phone
        - address
        - instagramUrl
        - facebookUrl
        - whatsapp
        - updatedAt
      properties:
        companyName:
          type: string
          maxLength: 100
          examples:
            - Glow – Estética Automotiva
        cnpj:
          type:
            - string
            - "null"
          pattern: "^[0-9A-Z]{12}[0-9]{2}$"
          description: Sem a máscara, com as letras em maiúsculas.
          examples:
            - "12345678000195"
        email:
          type:
            - string
            - "null"
          examples:
            - contato@glow.com
        phone:
          type:
            - string
            - "null"
          pattern: "^[0-9]{10,11}$"
          examples:
            - "8233334444"
        address:
          type:
            - string
            - "null"
          maxLength: 200
        instagramUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 200
        facebookUrl:
          type:
            - string
            - "null"
          format: uri
          maxLength: 200
        whatsapp:
          type:
            - string
            - "null"
          pattern: "^[0-9]{11}$"
          examples:
            - "82999998888"
        updatedAt:
          type: string
          format: date-time
          description: >-
            Versão do registro: enviada de volta no PUT como veio, tratada como
            texto (RNF011).
          examples:
            - "2026-10-20T13:45:12.345678+00:00"
      description: Dados como gravados, já normalizados (RN035).
    CompanySettingsInput:
      type: object
      required:
        - companyName
        - updatedAt
      properties:
        companyName:
          type: string
          description: Até 100 caracteres, em texto puro (RN035).
          examples:
            - Glow – Estética Automotiva
        cnpj:
          type:
            - string
            - "null"
          description: >-
            CNPJ de RN035, com ou sem a máscara, inclusive o alfanumérico;
            gravado sem a máscara, com as letras em maiúsculas.
          examples:
            - 12.345.678/0001-95
        email:
          type:
            - string
            - "null"
          description: Formato de RN035; gravado em minúsculas.
          examples:
            - contato@glow.com
        phone:
          type:
            - string
            - "null"
          description: >-
            Fixo ou celular com DDD válido (RN035); a máscara é aceita e
            removida.
          examples:
            - (82) 3333-4444
        address:
          type:
            - string
            - "null"
          description: Até 200 caracteres, em texto puro.
        instagramUrl:
          type:
            - string
            - "null"
          description: >-
            Endereço iniciado por https://, em instagram.com ou num subdomínio,
            com o caminho do perfil, até 200 caracteres (RN035).
          examples:
            - https://instagram.com/glow
        facebookUrl:
          type:
            - string
            - "null"
          description: >-
            Endereço iniciado por https://, em facebook.com ou num subdomínio,
            com o caminho da página, até 200 caracteres (RN035).
          examples:
            - https://facebook.com/glow
        whatsapp:
          type:
            - string
            - "null"
          description: >-
            Celular com DDD válido e nove dígitos, iniciado por 9 (RN035); a
            máscara é aceita e removida.
          examples:
            - (82) 99999-8888
        updatedAt:
          type: string
          format: date-time
          description: O updatedAt da última leitura, como veio.
      description: >-
        Campos não previstos são descartados (RS013). O opcional ausente, null
        ou vazio apaga o valor gravado.
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - requestId
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          examples:
            - Unauthorized
        status:
          type: integer
          examples:
            - 401
        detail:
          type: string
          description: Mensagem do catálogo de docs/padroes/api.md.
          examples:
            - E-mail ou senha incorretos.
        instance:
          type: string
          examples:
            - /api/auth/login
        code:
          type: string
          description: Código do catálogo de docs/padroes/api.md.
          examples:
            - INVALID_CREDENTIALS
        fields:
          type: object
          additionalProperties:
            type: string
          description: >-
            Só em VALIDATION_ERROR: a primeira mensagem de cada campo, com o
            caminho com pontos nos campos aninhados.
        requestId:
          type: string
          pattern: "^[0-9a-f]{8}$"
          examples:
            - 7f3c9a1e
  responses:
    ValidationError:
      description: >-
        VALIDATION_ERROR: campo fora do formato, com a mensagem em fields, ou
        corpo que não é JSON válido, sem fields.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ForbiddenOrigin:
      description: "FORBIDDEN: origem recusada (RS014)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE: corpo acima de 100 KB."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: "UNSUPPORTED_MEDIA_TYPE: corpo fora de application/json."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: >-
        INTERNAL_ERROR: falha inesperada; o detalhe fica só no registro, pelo
        requestId (RS017).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ServiceUnavailable:
      description: "SERVICE_UNAVAILABLE: o Supabase Auth não atendeu."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthenticated:
      description: >-
        UNAUTHENTICATED: sem sessão, sessão expirada ou encerrada, ou conta
        excluída ou sem perfil.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PanelForbidden:
      description: >-
        FORBIDDEN: cliente ou funcionário sem a permissão da página (RS008,
        RS010) ou, nas gravações, origem recusada (RS014). ACCOUNT_INACTIVE:
        funcionário desativado (RN026). PASSWORD_CHANGE_REQUIRED: senha inicial
        pendente de troca (RS004).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    VersionConflict:
      description: >-
        VERSION_CONFLICT: o registro mudou depois da leitura, e nada foi
        gravado (RNF011).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
